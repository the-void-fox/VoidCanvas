name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low,
          # so the binary runs on more distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: void_canvas
            asset: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: void_canvas.exe
            asset: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="void-canvas-${GITHUB_REF_NAME#v}-${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
