[package]
name = "void_canvas"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png"] }
ab_glyph = "0.2"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true