[package]
name = "void_canvas"
version = "1.0.1"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image    = "0.25"
ab_glyph = "0.2"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe", "wgpu"] }
log = "0.4"
