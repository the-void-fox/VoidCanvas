[package]
name = "void_canvas"
version = "2.0.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image    = "0.25"
# Animated GIF export, frames quantised and compressed in parallel (also used by `image`).
gif = "0.14"
ab_glyph = "0.2"
rfd = "0.14"
rhai = "1.27.0"
crc32fast = "1.5.3"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe", "wgpu"] }
log = "0.4"
